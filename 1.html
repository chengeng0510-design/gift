<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>给小韩 · 迟到的七夕礼物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background: #1a0b1a; /* 深色基底，衬托光效 */
        }

        /* ===== 花哨背景层 ===== */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 30%, #ff9a9e 0%, #fad0c4 30%, #fbc2eb 60%, #a18cd1 85%, #fbc2eb 100%);
            background-size: 200% 200%;
            animation: gradientMove 18s ease infinite alternate;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* 闪烁光晕 */
        .bg-layer::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 60% 40%, rgba(255,255,255,0.15) 0%, transparent 60%),
                        radial-gradient(circle at 30% 70%, rgba(255,200,230,0.2) 0%, transparent 50%);
            animation: shimmer 8s ease-in-out infinite alternate;
        }
        @keyframes shimmer {
            0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            100% { transform: translate(-5%, -5%) scale(1.1); opacity: 1; }
        }

        /* ===== 漂浮装饰 ===== */
        .floating-deco {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            font-size: 2.4rem;
            opacity: 0.5;
            animation: floatUp 12s infinite alternate ease-in-out;
            user-select: none;
            will-change: transform, opacity;
        }
        .floating-deco:nth-child(1) { left: 5%; top: 10%; animation-duration: 14s; font-size: 3rem; opacity: 0.4; }
        .floating-deco:nth-child(2) { left: 85%; top: 20%; animation-duration: 16s; animation-delay: 2s; font-size: 2rem; opacity: 0.5; }
        .floating-deco:nth-child(3) { left: 15%; top: 70%; animation-duration: 13s; animation-delay: 4s; font-size: 3.2rem; opacity: 0.3; }
        .floating-deco:nth-child(4) { left: 75%; top: 75%; animation-duration: 15s; animation-delay: 1s; font-size: 2.6rem; opacity: 0.4; }
        .floating-deco:nth-child(5) { left: 50%; top: 5%; animation-duration: 18s; animation-delay: 3s; font-size: 2rem; opacity: 0.3; }
        .floating-deco:nth-child(6) { left: 90%; top: 50%; animation-duration: 12s; animation-delay: 5s; font-size: 3rem; opacity: 0.4; }
        .floating-deco:nth-child(7) { left: 10%; top: 45%; animation-duration: 17s; animation-delay: 0.5s; font-size: 2.2rem; opacity: 0.35; }
        .floating-deco:nth-child(8) { left: 65%; top: 60%; animation-duration: 14s; animation-delay: 2.5s; font-size: 2.8rem; opacity: 0.3; }
        /* 更多小星星 */
        .floating-deco:nth-child(9) { left: 30%; top: 85%; animation-duration: 19s; animation-delay: 1.5s; font-size: 1.8rem; opacity: 0.5; }
        .floating-deco:nth-child(10) { left: 55%; top: 30%; animation-duration: 11s; animation-delay: 3.5s; font-size: 2rem; opacity: 0.4; }

        @keyframes floatUp {
            0% { transform: translate(0, 0) rotate(0deg) scale(0.9); opacity: 0.2; }
            25% { transform: translate(10px, -20px) rotate(10deg) scale(1.1); opacity: 0.6; }
            50% { transform: translate(-10px, -40px) rotate(-5deg) scale(0.95); opacity: 0.4; }
            75% { transform: translate(15px, -60px) rotate(8deg) scale(1.05); opacity: 0.7; }
            100% { transform: translate(-5px, -80px) rotate(-3deg) scale(1); opacity: 0.3; }
        }

        /* ===== 主卡片 ===== */
        .container {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.25), 0 8px 24px rgba(0,0,0,0.1);
            padding: 40px 32px 48px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.5);
            min-height: 500px;
            transition: all 0.3s ease;
            /* 增加内部柔和发光 */
            box-shadow: 0 0 80px rgba(255, 182, 193, 0.3), 0 20px 60px rgba(233, 30, 99, 0.2);
        }

        /* 封面 */
        .cover {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 420px;
        }

        .cover .heart-big {
            font-size: 80px;
            animation: beat 1.6s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(233,30,99,0.4));
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .cover h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 16px 0 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 40px rgba(233,30,99,0.2);
        }

        .cover .sub {
            font-size: 1.1rem;
            color: #ad1457;
            opacity: 0.85;
            letter-spacing: 6px;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .cover .btn-start {
            background: linear-gradient(135deg, #e91e63, #ad1457);
            border: none;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px 48px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(233, 30, 99, 0.45);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        .cover .btn-start::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            animation: btnGlow 3s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0% { transform: translate(-10%, -10%) scale(1); opacity: 0.5; }
            50% { transform: translate(10%, 10%) scale(1.2); opacity: 1; }
            100% { transform: translate(-10%, -10%) scale(1); opacity: 0.5; }
        }
        .cover .btn-start:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 32px rgba(233, 30, 99, 0.6);
        }
        .cover .btn-start:active {
            transform: scale(0.96);
        }

        /* 故事区域 */
        .story {
            display: none;
            animation: fadeUp 0.6s ease-out;
            min-height: 380px;
            flex-direction: column;
            cursor: pointer;
        }

        .story.active {
            display: flex;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .story .paragraph {
            display: none;
            font-size: 1.05rem;
            line-height: 1.9;
            color: #3e2c3b;
            text-indent: 2em;
            letter-spacing: 0.3px;
            padding: 0 4px;
            animation: fadeInText 0.8s ease forwards;
        }

        .story .paragraph.show {
            display: block;
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(12px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .story .paragraph:first-of-type {
            text-indent: 0;
            font-weight: 600;
            font-size: 1.15rem;
            color: #880e4f;
        }

        .story .paragraph:last-of-type {
            text-indent: 0;
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #ad1457;
            margin-top: 10px;
            border-top: 1px dashed #f8bbd0;
            padding-top: 20px;
            font-weight: 700;
        }

        /* 底部提示 */
        .hint {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: #bbb;
            letter-spacing: 2px;
            user-select: none;
            pointer-events: none;
        }

        /* 底部装饰（容器内） */
        .floating-hearts {
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 12px;
            margin-top: 10px;
            opacity: 0.4;
            user-select: none;
        }

        audio {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 18px 32px;
                border-radius: 28px;
            }
            .cover h1 {
                font-size: 2.6rem;
            }
            .cover .btn-start {
                font-size: 1.1rem;
                padding: 14px 36px;
            }
            .story .paragraph {
                font-size: 0.98rem;
                line-height: 1.8;
            }
            .story .paragraph:last-of-type {
                font-size: 1.3rem;
            }
            .cover .heart-big {
                font-size: 60px;
            }
            .hint {
                font-size: 0.75rem;
            }
            .floating-deco {
                font-size: 1.6rem !important;
            }
        }
    </style>
</head>
<body>

<!-- 花哨背景层 -->
<div class="bg-layer"></div>

<!-- 漂浮装饰 -->
<div class="floating-deco">❤️</div>
<div class="floating-deco">✨</div>
<div class="floating-deco">🌸</div>
<div class="floating-deco">💫</div>
<div class="floating-deco">🌹</div>
<div class="floating-deco">💖</div>
<div class="floating-deco">🌟</div>
<div class="floating-deco">💕</div>
<div class="floating-deco">✨</div>
<div class="floating-deco">❤️</div>

<!-- 主卡片 -->
<div class="container">
    <!-- 封面 -->
    <div class="cover" id="cover">
        <div class="heart-big">❤️</div>
        <h1>To 小韩</h1>
        <div class="sub">一份迟到的七夕礼物</div>
        <button class="btn-start" id="btnStart">✨ 开始阅读 ✨</button>
    </div>

    <!-- 故事正文 -->
    <div class="story" id="story">
        <!-- 段落由JS动态生成 -->
        <p class="hint">—— 点击任意处切换 ——</p>
        <div class="floating-hearts">💕 🌸 💕</div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
        你的浏览器不支持音频。
    </audio>
</div>

<script>
    (function() {
        // ----- 段落文本 -----
        const paragraphs = [
            "小韩：",
            "上次七夕因为太忙，没来得及给你准备礼物，现在给你补上，希望不算太晚。",
            "之前听你提过一嘴，说你妈妈用的颈部按摩仪特别好用，要是自己也有一个就好了。我悄悄记在心里，原本打算等你生日时作为礼物之一送给你。但后来我才发现，你说想要的是披肩式，而不是颈枕式——所以这次专门为你准备了这款披肩式的按摩仪。",
            "它的功能还挺实用的。每次你来例假都会疼得厉害，而我却很少能在你身边。以前我在的时候，帮你揉揉肚子你会好受一些；现在我不在时，就让它来替我分担吧。你刚来例假那几天最疼，这款按摩仪的腰靠面热敷功能正好派上用场——你疼的时候总爱趴着，把它垫在小腹下面，温温热热的很舒服。等过几天没那么疼了，还可以切换到按摩功能，轻柔地按一按后腰，那里也是你常酸疼的地方，用轻柔模式按摩一会儿，能缓解不少。",
            "我试了一下，在学校凳子上勉强也能用——虽然椅背有个大洞，支撑不太够，总归不如在床上靠得踏实，但有总比没有强。而且这个腰部按摩仪还可以和上次送你的颈部按摩仪搭配着用，肩颈和腰背一起放松，像是小陈在身边帮你捏一捏，应该能舒服不少。",
            "以后我忙着备考，能陪你的时间会越来越少。希望这个小东西能暂时代替我，在你需要的时候，安安静静地陪着你。"
        ];

        const storyEl = document.getElementById('story');
        const coverEl = document.getElementById('cover');
        const btnStart = document.getElementById('btnStart');
        const bgm = document.getElementById('bgm');

        // 获取提示和装饰元素，以便插入段落
        const hintEl = storyEl.querySelector('.hint');
        const heartsEl = storyEl.querySelector('.floating-hearts');

        // 生成段落 DOM（插入到提示之前）
        const fragment = document.createDocumentFragment();
        paragraphs.forEach(text => {
            const p = document.createElement('p');
            p.className = 'paragraph';
            p.textContent = text;
            fragment.appendChild(p);
        });
        storyEl.insertBefore(fragment, hintEl);

        const paraElements = storyEl.querySelectorAll('.paragraph');
        let currentIndex = 0;
        let isFinished = false;
        let isStarted = false;

        // 显示指定索引的段落
        function showParagraph(index) {
            paraElements.forEach(p => p.classList.remove('show'));
            if (index < paraElements.length) {
                paraElements[index].classList.add('show');
            }
        }

        // 切换到下一段
        function goToNext() {
            if (isFinished) return;
            if (currentIndex < paraElements.length - 1) {
                currentIndex++;
                showParagraph(currentIndex);
                if (currentIndex === paraElements.length - 1) {
                    isFinished = true;
                    hintEl.textContent = '💕 已全部读完 💕';
                }
            }
        }

        // 点击故事区域切换
        function handleStoryClick(e) {
            goToNext();
        }

        // 开始阅读
        function startStory() {
            if (isStarted) return;
            isStarted = true;

            coverEl.style.display = 'none';
            storyEl.classList.add('active');

            // 播放 BGM
            bgm.play().catch(e => console.warn('BGM 播放失败，请确认 bgm.mp3 已上传', e));

            currentIndex = 0;
            showParagraph(currentIndex);
            isFinished = false;
            hintEl.textContent = '—— 点击任意处切换 ——';

            storyEl.addEventListener('click', handleStoryClick);
        }

        btnStart.addEventListener('click', startStory);

        bgm.addEventListener('error', function() {
            console.warn('未找到 bgm.mp3，请将音乐文件与 index.html 放在同一目录。');
        });

    })();
</script>

</body>
</html>
