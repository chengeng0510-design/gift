<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>给小韩 · 迟到的七夕礼物</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #fce4ec 0%, #f3e5f5 100%);
            font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
            padding: 20px;
        }

        .container {
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(233, 30, 99, 0.15), 0 8px 24px rgba(0,0,0,0.06);
            padding: 40px 32px 48px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.6);
            min-height: 500px;
            transition: all 0.3s ease;
        }

        /* 封面 */
        .cover {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 420px;
        }

        .cover .heart-big {
            font-size: 80px;
            animation: beat 1.6s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        .cover h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.2rem;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 16px 0 8px;
            letter-spacing: 2px;
        }

        .cover .sub {
            font-size: 1.1rem;
            color: #ad1457;
            opacity: 0.8;
            letter-spacing: 6px;
            margin-bottom: 30px;
        }

        .cover .btn-start {
            background: linear-gradient(135deg, #e91e63, #ad1457);
            border: none;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px 48px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(233, 30, 99, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            letter-spacing: 2px;
        }

        .cover .btn-start:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 32px rgba(233, 30, 99, 0.45);
        }

        .cover .btn-start:active {
            transform: scale(0.96);
        }

        /* 故事区域 */
        .story {
            display: none;
            animation: fadeUp 0.6s ease-out;
            min-height: 380px;
            position: relative;
        }

        .story.active {
            display: block;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 每个段落默认完全透明且上移，等待显示 */
        .story .paragraph {
            font-size: 1.05rem;
            line-height: 1.9;
            color: #3e2c3b;
            margin-bottom: 0; /* 由容器撑开 */
            text-indent: 2em;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 0 4px;
            pointer-events: none; /* 防止遮挡点击 */
        }

        /* 显示状态 */
        .story .paragraph.show {
            opacity: 1;
            transform: translateY(0);
            position: relative; /* 恢复文档流，但切换时会重新变为absolute? 其实我们切换时控制显示，可以让所有段落绝对定位，但更好是让它们叠在一起。为了简单，我们使用absolute定位所有段落，使得它们重叠，当前显示的一个可见。这样切换时没有高度跳动。 */
        }

        /* 为了更好的重叠，让所有段落都绝对定位 */
        .story .paragraph {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 0 4px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
        }

        .story .paragraph.show {
            opacity: 1;
            transform: translateY(0);
            position: relative; /* 切换为相对定位，撑开父容器高度，但这样会导致其他段落也占据高度，导致跳动。更好的做法：所有段落都absolute，父容器给一个固定最小高度，或者用js动态调整高度。但是为了简单，我们可以让所有段落absolute，然后父容器高度由内容决定？但absolute不占空间，所以需要给story一个固定高度或者根据内容动态设置。我们可以用js在显示时设置高度。或者我们可以不用absolute，而是用display:none和block切换，但那样无法淡入淡出。为了有淡出效果，我们可以让所有段落叠加，但只有当前段落可见，其他段落不可见，但保持占位？不可见但占位会导致高度不变，但内容切换时，高度不变，但内容长度不同可能导致空白或溢出。最好还是使用absolute，然后动态设置父容器高度。简便做法：使用visibility和opacity，但visibility:hidden不占空间？实际上visibility:hidden占空间，但opacity:0也占空间，所以我们可以让所有段落都是相对定位，且占据空间，但只显示当前段落（其他opacity:0），这样高度会累加导致空白。但我们可以用display:none来隐藏不显示的段落，但那样没有淡入淡出。用户只要求“只有该段”，可以接受瞬间切换，但保留淡入效果即可，不要求淡出。所以我们可以把其他段落的opacity设为0，但依然占据空间，但会导致文字重叠？如果所有段落都相对定位，它们会按顺序排列，那么只有当前段可见，其他段隐藏（opacity:0）但依然占位，这样高度是固定的，但段落内容长度不同，占位空白可能影响美观。所以更好的做法是：每次只显示一个段落，其他段落display:none，这样不占空间，但无法淡入淡出。我们可以接受淡入，但不淡出，因为淡出不是必须。但用户没提淡出，只说“只有该段”，所以我们可以直接切换，前一段消失，后一段淡入。用display:none和block配合淡入动画（在block后添加类触发transition）。但display:none不能过渡，所以我们可以用visibility和opacity，但visibility:hidden依然占空间。最后我们采用：所有段落使用display:block，但初始opacity:0，且position:absolute，这样它们重叠，高度由父容器控制。我们需要设置父容器的高度，可以动态根据当前段落的高度设置，但麻烦。我们可以给story一个固定的最小高度，比如400px，然后文字居中显示。我们可以用flex居中。我决定使用更简单的方法：所有段落用display:none，然后显示当前段落时，改为display:block，然后添加一个类触发淡入动画（用@keyframes或transition）。因为display:block后立即添加类，可以触发transition。但display:block不会触发transition，所以需要先设置display:block，然后下一帧添加类。可以用requestAnimationFrame。或者用setTimeout 0。但更简单的方法：不使用transition，而是使用CSS animation，当添加类时触发动画。这样我们可以用animation: fadeIn 0.8s ease forwards; 这样即使display:block，动画也会执行。其他段落display:none。这样不会重叠，高度自动适应，而且只有当前段有动画。所以我们采用这个方法。这样代码更简洁。

        我们重写：所有段落默认display:none; 当需要显示某段时，设置display:block，并添加一个类'animate'，触发淡入动画。切换时，先将前一段display:none，再显示新段落。

        这样就没有淡出效果，但淡入是有的。符合“一段段文字浮现”的要求。

        我们按此修改。
        */

        /* 新的段落样式 */
        .story .paragraph {
            display: none; /* 默认隐藏 */
            font-size: 1.05rem;
            line-height: 1.9;
            color: #3e2c3b;
            text-indent: 2em;
            letter-spacing: 0.3px;
            animation: fadeInText 0.8s ease forwards;
            padding: 0 4px;
        }

        .story .paragraph.show {
            display: block; /* 显示时 */
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .story .paragraph:first-of-type {
            text-indent: 0;
            font-weight: 600;
            font-size: 1.15rem;
            color: #880e4f;
        }

        .story .paragraph:last-of-type {
            text-indent: 0;
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #ad1457;
            margin-top: 10px;
            border-top: 1px dashed #f8bbd0;
            padding-top: 20px;
            font-weight: 700;
        }

        /* 底部装饰 */
        .floating-hearts {
            text-align: center;
            font-size: 1.6rem;
            letter-spacing: 12px;
            margin-top: 20px;
            opacity: 0.5;
            user-select: none;
        }

        audio {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 18px 32px;
                border-radius: 28px;
            }
            .cover h1 {
                font-size: 2.6rem;
            }
            .cover .btn-start {
                font-size: 1.1rem;
                padding: 14px 36px;
            }
            .story .paragraph {
                font-size: 0.98rem;
                line-height: 1.8;
            }
            .story .paragraph:last-of-type {
                font-size: 1.3rem;
            }
            .cover .heart-big {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- 封面 -->
    <div class="cover" id="cover">
        <div class="heart-big">❤️</div>
        <h1>To 小韩</h1>
        <div class="sub">一份迟到的七夕礼物</div>
        <button class="btn-start" id="btnStart">✨ 开始阅读 ✨</button>
    </div>

    <!-- 故事正文 -->
    <div class="story" id="story">
        <!-- 段落由JS动态生成 -->
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
        你的浏览器不支持音频。
    </audio>
</div>

<script>
    (function() {
        // 段落文本
        const paragraphs = [
            "小韩：",
            "上次七夕因为太忙，没来得及给你准备礼物，现在给你补上，希望不算太晚。",
            "之前听你提过一嘴，说你妈妈用的颈部按摩仪特别好用，要是自己也有一个就好了。我悄悄记在心里，原本打算等你生日时作为礼物之一送给你。但后来我才发现，你说想要的是披肩式，而不是颈枕式——所以这次专门为你准备了这款披肩式的按摩仪。",
            "它的功能还挺实用的。每次你来例假都会疼得厉害，而我却很少能在你身边。以前我在的时候，帮你揉揉肚子你会好受一些；现在我不在时，就让它来替我分担吧。你刚来例假那几天最疼，这款按摩仪的腰靠面热敷功能正好派上用场——你疼的时候总爱趴着，把它垫在小腹下面，温温热热的很舒服。等过几天没那么疼了，还可以切换到按摩功能，轻柔地按一按后腰，那里也是你常酸疼的地方，用轻柔模式按摩一会儿，能缓解不少。",
            "我试了一下，在学校凳子上勉强也能用——虽然椅背有个大洞，支撑不太够，总归不如在床上靠得踏实，但有总比没有强。而且这个腰部按摩仪还可以和上次送你的颈部按摩仪搭配着用，肩颈和腰背一起放松，像是小陈在身边帮你捏一捏，应该能舒服不少。",
            "以后我忙着备考，能陪你的时间会越来越少。希望这个小东西能暂时代替我，在你需要的时候，安安静静地陪着你。"
        ];

        const storyEl = document.getElementById('story');
        const coverEl = document.getElementById('cover');
        const btnStart = document.getElementById('btnStart');
        const bgm = document.getElementById('bgm');

        // 生成段落元素，添加到story
        paragraphs.forEach(text => {
            const p = document.createElement('p');
            p.className = 'paragraph';
            p.textContent = text;
            storyEl.appendChild(p);
        });

        const paraElements = storyEl.querySelectorAll('.paragraph');
        let currentIndex = 0;
        let timer = null;

        // 显示指定索引的段落，隐藏其他
        function showParagraph(index) {
            // 隐藏所有
            paraElements.forEach(p => p.classList.remove('show'));
            // 显示目标
            if (index < paraElements.length) {
                paraElements[index].classList.add('show');
            }
        }

        // 开始逐段显示
        function startStory() {
            // 隐藏封面
            coverEl.style.display = 'none';
            // 显示故事区域
            storyEl.classList.add('active');

            // 播放BGM
            bgm.play().catch(e => console.warn('BGM播放失败', e));

            // 显示第一段
            currentIndex = 0;
            showParagraph(currentIndex);
            currentIndex++;

            // 设定定时器，每隔5秒显示下一段
            timer = setInterval(function() {
                if (currentIndex < paraElements.length) {
                    showParagraph(currentIndex);
                    currentIndex++;
                } else {
                    // 全部显示完毕，清除定时器
                    clearInterval(timer);
                    timer = null;
                }
            }, 5000); // 5秒间隔，速度为原来的五分之一（原1秒）
        }

        // 点击开始按钮
        btnStart.addEventListener('click', startStory);

        // 如果用户想重新开始，可以刷新页面，这里不做额外处理

        // BGM错误提示
        bgm.addEventListener('error', function() {
            console.warn('未找到 bgm.mp3，请确保文件已上传。');
        });
    })();
</script>

</body>
</html>
